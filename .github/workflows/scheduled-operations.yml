name: Scheduled operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Authenticated operation to invoke
        required: true
        type: choice
        options:
          - drain-email-outbox
          - check-operational-health
          - reconcile-payments
          - cleanup-logo-assets
          - cleanup-retention

permissions:
  contents: read

concurrency:
  group: goneviral-scheduled-operations
  cancel-in-progress: false

jobs:
  invoke:
    if: ${{ vars.GONEVIRAL_SCHEDULED_OPERATIONS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Invoke authenticated operation
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          GONEVIRAL_SCHEDULED_OPERATIONS_ENABLED: ${{ vars.GONEVIRAL_SCHEDULED_OPERATIONS_ENABLED }}
          GONEVIRAL_SCHEDULED_OPERATIONS_BASE_URL: ${{ vars.GONEVIRAL_SCHEDULED_OPERATIONS_BASE_URL }}
        run: node scripts/operations/invoke-scheduled-operations.mjs
